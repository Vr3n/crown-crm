[package]
name = "crown-books"
version = "0.1.0"
description = "Crown Books - offline-first accounting for small businesses"
authors = ["Viren Patel"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "crown_books_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
thiserror = "2"
scrypt = "0.12"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rust_xlsxwriter = "0.102"
printpdf = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
