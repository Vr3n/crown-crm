name: Build & Package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build app (main/preload/renderer into out/)
        run: npx electron-vite build

      - name: Build and package (fuses applied via afterPack hook)
        run: npx electron-builder --win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CrownCRM-setup
          path: dist/CrownCRM-*-setup.exe
          if-no-files-found: error
